[phases.setup]
nixPkgs = ["bun"]

# Node.js from a separate nixpkgs pin so it gets security releases without
# moving Bun (Node.js Oct 2026 security release: 22.23.4).
[phases.node]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[start]
cmd = "bun src/index.ts"
